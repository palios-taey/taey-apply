name: public-boundary

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Public boundary
        run: python3 tools/check_public_boundary.py
      - name: Cold import and CLI install
        run: |
          python3 -m pip install .
          python3 -c "import taey_apply; print(taey_apply.__version__)"
          taey-prepare-linkedin-intake --help
          taey-prepare-linkedin-classification --help
          taey-linkedin-intake --help
          taey-linkedin-classification --help
          taey-materialize-application --help
          taey-prepare-application --help
          taey-run-application --help
      - name: Transaction preparer gate
        run: python3 tools/validate_preparer.py
      - name: Contract gate
        run: python3 tools/validate_contract.py
      - name: Classification contract gate
        run: python3 tools/validate_classification.py
      - name: Classification preparer gate
        run: python3 tools/validate_classification_preparer.py
      - name: Autonomous application boundary gate
        run: python3 tools/validate_application_boundary.py
      - name: Autonomous application materializer gate
        run: python3 tools/validate_application_materializer.py
      - name: Greenhouse application action compiler gate
        run: python3 tools/validate_application_action_compiler.py
      - name: Greenhouse autonomous executor gate
        run: python3 tools/validate_application_executor.py
      - name: Build wheel
        run: python3 -m pip wheel . --no-deps --wheel-dir dist
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
