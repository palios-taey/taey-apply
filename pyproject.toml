[build-system]
requires = ["setuptools>=69,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "taey-apply"
version = "0.1.0"
description = "Receipt-bound private intake connectors for Taey"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "PALIOS-TAEY"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: POSIX :: Linux",
]
dependencies = []

[project.scripts]
taey-linkedin-intake = "taey_apply.cli:main"
taey-prepare-linkedin-intake = "taey_apply.prepare_cli:main"
taey-prepare-linkedin-classification = "taey_apply.classification_prepare_cli:main"
taey-linkedin-classification = "taey_apply.classification_cli:main"
taey-materialize-application = "taey_apply.application_materialize_cli:main"
taey-prepare-application = "taey_apply.application_prepare_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
